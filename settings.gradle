pluginManagement {
    repositories {
        // Aliyun Gradle Plugin Portal mirror
        maven {
            name = 'AliyunGradlePluginPortal'
            url = 'https://maven.aliyun.com/repository/gradle-plugin'
        }
        // Aliyun public repository
        maven {
            name = 'AliyunPublic'
            url = 'https://maven.aliyun.com/repository/public'
        }
        // Official Fabric repository fallback
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositories {
        // Preferred Aliyun public repository
        maven {
            name = 'AliyunPublic'
            url = 'https://maven.aliyun.com/repository/public'
        }
        // Aliyun Google repository mirror
        maven {
            name = 'AliyunGoogle'
            url = 'https://maven.aliyun.com/repository/google'
        }
        // Tencent Cloud Maven fallback
        maven {
            name = 'TencentCloud'
            url = 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/'
        }
        // Official Fabric repository
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
    }
}

rootProject.name = 'RichChat'
