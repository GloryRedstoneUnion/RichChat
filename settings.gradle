pluginManagement {
    repositories {
        // 阿里云 Gradle 插件门户镜像
        maven {
            name = 'AliyunGradlePluginPortal'
            url = 'https://maven.aliyun.com/repository/gradle-plugin'
        }
        // 阿里云公共仓库
        maven {
            name = 'AliyunPublic'
            url = 'https://maven.aliyun.com/repository/public'
        }
        // Fabric 官方仓库（保留作为兜底）
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

